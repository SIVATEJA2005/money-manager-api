#
#3.) with env config
spring.application.name=moneymanager
# Server configuration
#server.servlet.context-path=/api/v1.0
# Database configuration (using .env variables)
spring.datasource.url=${LOCAL_DB_URL}
spring.datasource.username=${LOCAL_DB_USERNAME}
spring.datasource.password=${LOCAL_DB_PASSWORD}
# JPA configuration (these are usually left static)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Sending email configuration (using .env variables)
spring.mail.host=${BREVO_HOST}
spring.mail.port=${BREVO_PORT}
spring.mail.username=${BREVO_USERNAME}
spring.mail.password=${BREVO_PASSWORD}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.from=${FROM_EMAIL}
# Custom properties
jwt_secret=${JWT_SECRET}
spring.profiles.active=prod
money.manager.frontend.url=${FRONTEND_URL}
activation.link.url=${BACKEND_URL}${ACTIVATION_LINK}
money.manager.backend.url=${BACKEND_URL}
